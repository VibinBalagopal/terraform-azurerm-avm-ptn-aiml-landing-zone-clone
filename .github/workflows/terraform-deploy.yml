---
name: Terraform Deploy

on:
  pull_request:
    branches: [main]
    paths:
      - '**.tf'
      - '**.tfvars'
      - '.github/workflows/terraform-deploy.yml'
  push:
    branches: [main]
    paths:
      - '**.tf'
      - '**.tfvars'
      - '.github/workflows/terraform-deploy.yml'
  workflow_dispatch:
    inputs:
      working_directory:
        description: 'Terraform working directory (for example: examples/standalone)'
        required: false
        default: 'examples/standalone'
      tfvars_file:
        description: 'Optional tfvars file path relative to working directory'
        required: false
        default: ''
      destroy:
        description: 'Set to true to run terraform destroy instead of apply'
        required: false
        default: 'false'
      force_apply:
        description: 'Set to true to run apply on workflow_dispatch even when plan has no changes'
        required: false
        default: 'false'

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write       # Required for OIDC authentication to Azure
  contents: read
  pull-requests: write  # Required to post plan output as PR comment

env:
  TF_VERSION: "1.12.2"
  TF_IN_AUTOMATION: true
  TF_WORKING_DIR: ${{ github.event.inputs.working_directory || 'examples/standalone' }}
  TF_VARS_FILE: ${{ github.event.inputs.tfvars_file || '' }}
  TF_STATE_RG_DEFAULT: "rg-tfstate-aiml"
  TF_STATE_STORAGE_ACCOUNT_DEFAULT: "staimljshgfa"
  TF_STATE_CONTAINER_DEFAULT: "tfstate"
  TF_STATE_KEY_DEFAULT: "aiml-landing-zone.tfstate"
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID != '' && secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID != '' && secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  # ─── Validate & Format Check ────────────────────────────────────────────────
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Validate deployment configuration
        run: |
          test -d "${{ env.TF_WORKING_DIR }}" || { echo "Working directory not found: ${{ env.TF_WORKING_DIR }}"; exit 1; }
          test -n "${{ env.ARM_CLIENT_ID }}" || { echo "Missing required AZURE_CLIENT_ID (add as secret or variable)"; exit 1; }
          test -n "${{ env.ARM_TENANT_ID }}" || { echo "Missing required AZURE_TENANT_ID (add as secret or variable)"; exit 1; }
          test -n "${{ env.ARM_SUBSCRIPTION_ID }}" || { echo "Missing required AZURE_SUBSCRIPTION_ID (add as secret or variable)"; exit 1; }

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

  # ─── Plan (runs on every PR and push) ───────────────────────────────────────
  plan:
    name: Plan
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      plan_exit_code: ${{ steps.plan.outputs.exit_code }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true

      - name: Validate deployment configuration
        run: |
          test -d "${{ env.TF_WORKING_DIR }}" || { echo "Working directory not found: ${{ env.TF_WORKING_DIR }}"; exit 1; }
          test -n "${{ env.ARM_CLIENT_ID }}" || { echo "Missing required AZURE_CLIENT_ID (add as secret or variable)"; exit 1; }
          test -n "${{ env.ARM_TENANT_ID }}" || { echo "Missing required AZURE_TENANT_ID (add as secret or variable)"; exit 1; }
          test -n "${{ env.ARM_SUBSCRIPTION_ID }}" || { echo "Missing required AZURE_SUBSCRIPTION_ID (add as secret or variable)"; exit 1; }

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          BACKEND_RG="${{ secrets.TF_STATE_RG }}"
          BACKEND_STORAGE_ACCOUNT="${{ secrets.TF_STATE_STORAGE_ACCOUNT }}"
          BACKEND_CONTAINER="${{ secrets.TF_STATE_CONTAINER }}"
          BACKEND_KEY="${{ secrets.TF_STATE_KEY }}"

          [ -z "$BACKEND_RG" ] && BACKEND_RG="${{ env.TF_STATE_RG_DEFAULT }}"
          [ -z "$BACKEND_STORAGE_ACCOUNT" ] && BACKEND_STORAGE_ACCOUNT="${{ env.TF_STATE_STORAGE_ACCOUNT_DEFAULT }}"
          [ -z "$BACKEND_CONTAINER" ] && BACKEND_CONTAINER="tfstate"
          [ -z "$BACKEND_KEY" ] && BACKEND_KEY="aiml-landing-zone.tfstate"

          terraform init \
            -reconfigure \
            -input=false \
            -backend-config="resource_group_name=${BACKEND_RG}" \
            -backend-config="storage_account_name=${BACKEND_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${BACKEND_CONTAINER}" \
            -backend-config="key=${BACKEND_KEY}"

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          PLAN_ARGS=()
          if [ -n "${{ env.TF_VARS_FILE }}" ]; then
            if [ ! -f "${{ env.TF_VARS_FILE }}" ]; then
              echo "Configured tfvars file not found: ${{ env.TF_VARS_FILE }}"
              exit 1
            fi
            PLAN_ARGS+=("-var-file=${{ env.TF_VARS_FILE }}")
          fi

          if [ "${{ github.event.inputs.destroy }}" == "true" ]; then
            terraform plan -destroy "${PLAN_ARGS[@]}" -out=tfplan -detailed-exitcode 2>&1 | tee plan.txt
          else
            terraform plan "${PLAN_ARGS[@]}" -out=tfplan -detailed-exitcode 2>&1 | tee plan.txt
          fi
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 5

      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.TF_WORKING_DIR }}/plan.txt', 'utf8');
            const maxLength = 65000;
            const truncated = plan.length > maxLength
              ? plan.substring(0, maxLength) + '\n\n... (output truncated)'
              : plan;
            const exitCode = '${{ steps.plan.outputs.exit_code }}';
            const status = exitCode === '0' ? '✅ No changes' : exitCode === '2' ? '⚠️ Changes detected' : '❌ Plan failed';
            const body = `## Terraform Plan — ${status}
            **Working directory:** ${{ env.TF_WORKING_DIR }}
            <details><summary>Show Plan</summary>

            \`\`\`hcl
            ${truncated}
            \`\`\`
            </details>

            *Triggered by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Fail if plan errored
        if: steps.plan.outputs.exit_code == '1'
        run: exit 1

  # ─── Apply (runs only on push to main) ──────────────────────────────────────
  apply:
    name: Apply
    runs-on: ubuntu-latest
    needs: plan
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      (
        needs.plan.outputs.plan_exit_code == '2' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.force_apply == 'true')
      )
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          BACKEND_RG="${{ secrets.TF_STATE_RG }}"
          BACKEND_STORAGE_ACCOUNT="${{ secrets.TF_STATE_STORAGE_ACCOUNT }}"
          BACKEND_CONTAINER="${{ secrets.TF_STATE_CONTAINER }}"
          BACKEND_KEY="${{ secrets.TF_STATE_KEY }}"

          [ -z "$BACKEND_RG" ] && BACKEND_RG="${{ env.TF_STATE_RG_DEFAULT }}"
          [ -z "$BACKEND_STORAGE_ACCOUNT" ] && BACKEND_STORAGE_ACCOUNT="${{ env.TF_STATE_STORAGE_ACCOUNT_DEFAULT }}"
          [ -z "$BACKEND_CONTAINER" ] && BACKEND_CONTAINER="tfstate"
          [ -z "$BACKEND_KEY" ] && BACKEND_KEY="aiml-landing-zone.tfstate"

          terraform init \
            -reconfigure \
            -input=false \
            -backend-config="resource_group_name=${BACKEND_RG}" \
            -backend-config="storage_account_name=${BACKEND_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${BACKEND_CONTAINER}" \
            -backend-config="key=${BACKEND_KEY}"

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan
